name: MeijiReborn NeoForge port

on:
  push:
    branches:
      - chatgpt/meijireborn-neoforge-1.21.1
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Fabric bytecode input
        shell: bash
        run: |
          mkdir -p work
          base64 --decode input/code-only.jar.b64 > work/code-only.jar
          echo "30737347ba2112af75045cdbf3b6c1c407e77f8c510fd8af1b88a2216430df03  work/code-only.jar" | sha256sum --check
          unzip -t work/code-only.jar
      - name: Download CFR 0.152
        shell: bash
        run: |
          curl --fail --location --retry 5 --output work/cfr.jar \
            https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          java -jar work/cfr.jar --version
      - name: Decompile MeijiReborn classes
        shell: bash
        run: |
          mkdir -p work/decompiled
          java -jar work/cfr.jar work/code-only.jar \
            --outputdir work/decompiled \
            --silent true \
            --clobber true \
            --caseinsensitivefs true
          test -f work/decompiled/com/meijireborn/SengokuReborn.java
          find work/decompiled -name '*.java' -print | sort > work/decompiled-files.txt
          wc -l work/decompiled-files.txt
          zip -qr work/meijireborn-decompiled.zip work/decompiled work/decompiled-files.txt
      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: meijireborn-decompiled
          path: |
            work/meijireborn-decompiled.zip
            work/decompiled-files.txt
          if-no-files-found: error
          retention-days: 7
